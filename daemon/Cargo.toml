[package]
name = "fg-daemon"
version = "0.0.0"
edition = "2024"

[dependencies]
cached = { version = "0.55.1", features = ["tokio"] }
dotenvy = "0.15.7"
notify = "8.0.0"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["alloc", "derive"] }
serde_json = { version = "1.0.140", features = ["alloc", "raw_value"] }
temporal_rs = { git = "https://github.com/boa-dev/temporal", rev = "531cee14769e8c077c59a1faf67d5465e85f5afa", features = [
    "compiled_data",
] }
tokio = { version = "1.45.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
